<p style="color: #3d4a3d; font-size: 16px; line-height: 1.8; margin-bottom: 16px">这是一篇示例文章，用于测试 <strong style="color: #4a8058">md2wechat</strong> 的转换功能。本文将展示各种 Markdown 元素的渲染效果。</p>

<h3 style="color: #4a8058; border-bottom: 2px solid #6b9b7a; padding-bottom: 8px; margin-top: 22px; margin-bottom: 12px; font-size: 18px; font-weight: 500">列表展示</h3>
<ul style="margin: 16px 0; padding-left: 24px;"><li style="margin: 8px 0; line-height: 1.75;">• 第一点内容</li><li style="margin: 8px 0; line-height: 1.75;">• 第二点内容</li><li style="margin: 8px 0; line-height: 1.75;">• 第三点内容</li></ul>

<p style="color: #3d4a3d; font-size: 16px; line-height: 1.8; margin-bottom: 16px">这是一段包含 <strong style="color: #4a8058">粗体</strong> 和 <em>斜体</em> 的文字。我们还可以使用 ~~删除线~~ 效果。</p>
