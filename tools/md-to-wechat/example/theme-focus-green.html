<h3 style="color: #6B7280; border-bottom: 1px dashed #059669; padding: 0 0 0.4em 0; margin: 2em 8px 0.75em 0; font-size: 18px; font-weight: bold; line-height: 1.2">列表展示</h3>

<p style="color: #064E3B; font-size: 15px; line-height: 1.75; margin: 1.2em 8px; text-align: justify; letter-spacing: 0.1em">这是一段包含 <strong style="color: #059669; font-weight: bold">粗体</strong> 和 <em>斜体</em> 的文字。我们还可以使用 ~~删除线~~ 效果。</p>
